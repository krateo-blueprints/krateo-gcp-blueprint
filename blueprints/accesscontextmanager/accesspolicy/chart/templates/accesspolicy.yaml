{{- /*
Renders a native Config Connector AccessContextManagerAccessPolicy custom resource from the Composition spec.

The Composition spec (.Values) mirrors the Config Connector AccessContextManagerAccessPolicy spec, so it passes
through verbatim. `projectId` is Krateo-wiring (not part of the AccessContextManagerAccessPolicy spec) and becomes
the standard cnrm.cloud.google.com/project-id annotation; when it is empty the annotation is
omitted and Config Connector resolves the project from the namespace. `global` (injected by
Krateo/Helm) is omitted so it never leaks into the AccessContextManagerAccessPolicy spec.
Generated by tools/kccgen.
*/ -}}
apiVersion: accesscontextmanager.cnrm.cloud.google.com/v1beta1
kind: AccessContextManagerAccessPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gcp-accesscontextmanager-accesspolicy.labels" . | nindent 4 }}
  {{- with .Values.projectId }}
  annotations:
    cnrm.cloud.google.com/project-id: {{ . | quote }}
  {{- end }}
{{- $spec := omit .Values "projectId" "global" }}
{{- if $spec }}
spec:
{{ toYaml $spec | indent 2 }}
{{- else }}
spec: {}
{{- end }}
