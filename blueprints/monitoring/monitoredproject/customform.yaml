apiVersion: v1
data:
  drawer: "true"
  form: "true"
  showFormStructure: "true"
  drawerSize: large
kind: ConfigMap
metadata:
  name: template-gcp-monitoring-monitoredproject-card
  namespace: gcp-monitoring-system
---
apiVersion: templates.krateo.io/v1alpha1
kind: Widget
metadata:
  name: template-gcp-monitoring-monitoredproject-card
  namespace: gcp-monitoring-system
spec:
  actions:
  - template:
      apiVersion: templates.krateo.io/v1alpha1
      name: template-gcp-monitoring-monitoredproject-customform
      namespace: gcp-monitoring-system
      resource: customforms
      verb: GET
  - template:
      apiVersion: core.krateo.io/v1alpha1
      name: gcp-monitoring-monitoredproject
      namespace: gcp-monitoring-system
      resource: compositiondefinitions
      verb: DELETE
  app:
    template:
      color: ${ .getCompositionDefinition.status.conditions[] | select(.type == "Ready") | if .status == "False" then "orange" elif .status == "True" then "green" else "grey" end }
      content: Provision a Google Cloud Monitoring MonitoringMonitoredProject via Config Connector.
      icon: fa-brands fa-google
      tags: gcp-monitoring-system,0.1.0
      title: gcp-monitoring-monitoredproject
      status: ${ .getCompositionDefinition.status.conditions[] | select(.type == "Ready") | "Ready:" + .status }
      date: ${ .getCompositionDefinition.metadata.creationTimestamp }
  propsRef:
    name: template-gcp-monitoring-monitoredproject-card
    namespace: gcp-monitoring-system
  type: card
  api:
  - name: getCompositionDefinition
    path: "/apis/core.krateo.io/v1alpha1/namespaces/gcp-monitoring-system/compositiondefinitions/gcp-monitoring-monitoredproject"
    verb: GET
    headers:
    - 'Accept: application/json'
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: template-gcp-monitoring-monitoredproject-customform
  namespace: gcp-monitoring-system
data:
  onSubmitId: submit
  onSubmitVerb: POST
  payloadFormKey: spec
  redirectRoute: /compositions/${metadata.namespace}/${metadata.name}
  redirectTimeout: "50"
---
apiVersion: templates.krateo.io/v1alpha1
kind: CustomForm
metadata:
  name: template-gcp-monitoring-monitoredproject-customform
  namespace: gcp-monitoring-system
spec:
  type: customform
  propsRef:
    name: template-gcp-monitoring-monitoredproject-customform
    namespace: gcp-monitoring-system
  actions:
    - template:
        id: submit
        apiVersion: composition.krateo.io/v0-1-0
        verb: POST
        resource: gcpmonitoringmonitoredprojects
        payloadToOverride:
        - name: metadata.namespace
          value: ${ "gcp-monitoring-system" }
  app:
    template:
      schema: ${ .getCRD | .spec.versions[] | select(.name == "v0-1-0") | .schema.openAPIV3Schema.properties.spec }
  api:
  - name: getCRD
    path: "/apis/apiextensions.k8s.io/v1/customresourcedefinitions/gcpmonitoringmonitoredprojects.composition.krateo.io"
    verb: GET
    headers:
    - 'Accept: application/json'
