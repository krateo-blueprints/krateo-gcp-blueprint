# Verbatim from the Config Connector operator release bundle (1.99.0),
# except the container image, which is a values knob so the installer's
# global.imageRegistry mirror pattern can reach it. Upstream is repackaged, never patched.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    cnrm.cloud.google.com/operator-version: 1.99.0
  labels:
    cnrm.cloud.google.com/operator-system: 'true'
  name: configconnector-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: configconnector-operator-manager-role
subjects:
- kind: ServiceAccount
  name: configconnector-operator
  namespace: configconnector-operator-system
