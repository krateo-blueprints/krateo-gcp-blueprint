# The two cluster-scoped CRDs the Config Connector operator defines: ConfigConnector and
# ConfigConnectorContext. Repackaged verbatim from the upstream operator release bundle.
#
# Shipped as a DEDICATED -crds composition so the CRDs land before anything that creates a
