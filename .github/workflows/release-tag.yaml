name: release-tag

# Packages every chart in this repo and publishes each to the GitHub Container Registry as an
# OCI Helm artifact on every semver tag.
#
# Pushing tag "0.1.0" publishes:
#   oci://ghcr.io/krateo-blueprints/charts/gcp-<service>-<resource>:0.1.0   (blueprints/)
#   oci://ghcr.io/krateo-blueprints/charts/krateo-gcp-configconnector:0.1.0 (operator/)
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Resolve version and registry
        id: resolve
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # Collected per channel for publish-chart.yaml: the Marketplace index is built from the
          # .tgz this run uploads, NOT from the OCI registry, so a chart pushed to GHCR and never
          # handed to the publisher stays invisible in the Marketplace. That was the whole reason no
          # GCP blueprint appeared there.
          mkdir -p "${RUNNER_TEMP}/charts-dist-blueprints" "${RUNNER_TEMP}/charts-dist-operators"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push every chart
        run: |
          set -euo pipefail
          # Stamp every CompositionDefinition. They pin their chart's version and live outside
          # the chart dir, so the per-chart Chart.yaml stamp misses them -- hardcoded, they
          # register versions that were never published.
          cdc=0
          while IFS= read -r -d "" cd; do
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"; cdc=$((cdc+1))
          done < <(find blueprints -type f -name compositiondefinition.yaml -not -path "*/charts/*" -print0 2>/dev/null)
          echo "stamped ${cdc} CompositionDefinition(s)"

          shopt -s nullglob
          published=0
          # operator/ FIRST: it is the part an install cannot proceed without, and GHCR starts
          # rejecting pushes ("failed to perform Tag on destination: ... not found") once a run has
          # pushed a couple of hundred artifacts. Publishing the operator last meant two runs in a
          # row died before reaching it.
          for chart in operator/* blueprints/*/*/chart; do
            [ -f "${chart}/Chart.yaml" ] || continue
            name=$(awk '/^name:/{print $2; exit}' "${chart}/Chart.yaml")
            echo "::group::${name} (${chart})"
            sed -i "s/CHART_VERSION/${VERSION}/g" "${chart}/Chart.yaml"
            helm package "${chart}" --destination .
            # Retry: that GHCR tag error is transient and a single push failure otherwise
            # abandons every chart after it.
            ok=0
            for attempt in 1 2 3 4 5; do
              if helm push "${name}-${VERSION}.tgz" "${OCI_REPO}"; then ok=1; break; fi
              echo "push attempt ${attempt} failed for ${name}; retrying in $((attempt*10))s"
              sleep $((attempt*10))
            done
            if [ "${ok}" -ne 1 ]; then
              echo "::error::${name} failed to publish after 5 attempts"
              exit 1
            fi
            echo "Published ${OCI_REPO}/${name}:${VERSION}"
            # Same bytes to the publisher. operator/ charts are plain Helm charts and go to the
            # operators channel; blueprints/ carry values.schema.json + compositiondefinition.yaml
            # and pass the blueprints channel gate.
            case "${chart}" in
              operator/*)      cp "${name}-${VERSION}.tgz" "${RUNNER_TEMP}/charts-dist-operators/" ;;
              blueprints/*)    cp "${name}-${VERSION}.tgz" "${RUNNER_TEMP}/charts-dist-blueprints/" ;;
            esac
            published=$((published+1))
            echo "::endgroup::"
          done
          # Assert the loop actually did something: a glob that matches nothing would
          # otherwise finish green having published no charts at all.
          echo "published ${published} chart(s)"
          if [ "${published}" -eq 0 ]; then
            echo "::error::no charts published — the chart glob matched nothing"
            exit 1
          fi

      - name: Upload blueprint charts for the publisher
        uses: actions/upload-artifact@v4
        with:
          # Name and layout (.tgz at the artifact root) are what publish-chart.yaml downloads.
          name: charts-dist-blueprints
          path: ${{ runner.temp }}/charts-dist-blueprints/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload operator charts for the publisher
        uses: actions/upload-artifact@v4
        with:
          name: charts-dist-operators
          path: ${{ runner.temp }}/charts-dist-operators/*.tgz
          if-no-files-found: error
          retention-days: 1

  # krateo-blueprints/charts uploads each package to its Releases and merges its entry into the
  # channel index on gh-pages, which the Marketplace reads. Called once PER CHANNEL, as that
  # workflow requires. Neither this repo nor krateo-aws-blueprint called it before, which is why
  # the blueprints index held 250 hand-seeded AWS entries and no GCP ones at all.
  publish-blueprints:
    needs: package-and-push
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@main
    permissions:
      contents: read
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ needs.package-and-push.outputs.version }}
      channel: blueprints
      artifact: charts-dist-blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN || secrets.RELEASE_FEED_TOKEN }}

  publish-operators:
    needs: package-and-push
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@main
    permissions:
      contents: read
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ needs.package-and-push.outputs.version }}
      channel: operators
      artifact: charts-dist-operators
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN || secrets.RELEASE_FEED_TOKEN }}
