name: lint

# Renders every chart in the repo. `helm template` is authoritative: it enforces each chart's
# values.schema.json, which is the same contract core-provider uses to build the Composition CRD.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm template every chart
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0; n=0
          for chart in blueprints/*/*/chart operator/*; do
            [ -f "${chart}/Chart.yaml" ] || continue
            n=$((n+1))
            tmp=$(mktemp -d); cp -r "${chart}" "${tmp}/chart"
            sed -i "s/CHART_VERSION/0.0.0-ci/g" "${tmp}/chart/Chart.yaml"
            if ! out=$(helm template release "${tmp}/chart" --namespace ci 2>&1); then
              echo "::error::${chart}"; echo "${out}" | tail -5; fail=$((fail+1))
            fi
            rm -rf "${tmp}"
          done
          echo "rendered ${n} chart(s), ${fail} failure(s)"
          # A glob matching nothing must not pass as success.
          [ "${n}" -gt 0 ] || { echo "::error::no charts found to render"; exit 1; }
          [ "${fail}" -eq 0 ]
